[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dggen"
# The version is written once, as `dggen.__version__` (see [tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "Generate pre-made character sheets (PDF) for the Delta Green pen-and-paper RPG."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "reportlab~=4.0",
    "faker~=40.23.0",
    # reportlab requires Pillow but only "pillow>=9". 13.0.0 fixes the advisories open against 12.x.
    "pillow>=13.0.0",
]

[project.optional-dependencies]
# pip is here, not in the runtime dependencies: 26.2.0 fixed its advisories, but pip cannot upgrade
# itself through pip.exe on Windows, so install with `python -m pip install -e ".[dev]"`.
dev = [
    "pytest>=8",
    "pypdf>=6.21.2",
    "mypy>=1.10",
    "types-reportlab",
    "ruff>=0.6",
    "pip>=26.2.0",
]

[project.scripts]
dggen = "dggen.cli:main"

[tool.setuptools]
packages = ["dggen", "dggen.rules"]

[tool.setuptools.dynamic]
version = { attr = "dggen.__version__" }

# The generator relies on fonts, images and data files under dggen/data/ (found via
# dggen.config.DATA_DIR). They are not Python packages, so they must be listed as package data
# or they are silently left out of the wheel.
[tool.setuptools.package-data]
dggen = ["py.typed", "data/**/*"]

[tool.setuptools.exclude-package-data]
# Reference/template PDFs kept in the repo for humans; nothing at runtime reads them.
dggen = ["data/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# `mypy` checks the package strictly. tests/test_typing.py also checks tests/ (with the
# untyped-def rules relaxed: fixtures and test functions are deliberately unannotated).
python_version = "3.11"
files = ["dggen"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # likely bugs
    "SIM",     # simplifications
    "PERF",    # needless slowness
    "RUF",     # ruff's own
    "PLC",     # pylint conventions (imports not at top level, ...)
    "PLR0912", # too many branches
    "ARG",     # unused arguments
]
