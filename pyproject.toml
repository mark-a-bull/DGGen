[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dggen"
version = "2.0"
description = "Generate pre-made character sheets (PDF) for the Delta Green pen-and-paper RPG."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "reportlab~=4.0",
    "faker~=40.23.0",
    # reportlab requires Pillow but only "pillow>=9". 13.0.0 fixes the advisories open against
    # 12.x; it needs Python 3.11+, so Python 3.10 keeps the newest Pillow it can install.
    "pillow>=13.0.0; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=6.21.2", "mypy>=1.10", "types-reportlab", "ruff>=0.6"]

[project.scripts]
dggen = "dggen.cli:main"

[tool.setuptools]
packages = ["dggen", "dggen.rules"]

# The generator relies on fonts, images and data files under dggen/data/ (found via
# dggen.config.DATA_DIR). They are not Python packages, so they must be listed as package data
# or they are silently left out of the wheel.
[tool.setuptools.package-data]
dggen = ["data/**/*"]

[tool.setuptools.exclude-package-data]
# Reference/template PDFs kept in the repo for humans; nothing at runtime reads them.
dggen = ["data/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# `mypy` checks the package strictly. tests/test_typing.py also checks tests/ (with the
# untyped-def rules relaxed: fixtures and test functions are deliberately unannotated).
python_version = "3.10"
files = ["dggen"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # likely bugs
    "SIM",     # simplifications
    "PERF",    # needless slowness
    "RUF",     # ruff's own
    "PLC",     # pylint conventions (imports not at top level, ...)
    "PLR0912", # too many branches
    "ARG",     # unused arguments
]
